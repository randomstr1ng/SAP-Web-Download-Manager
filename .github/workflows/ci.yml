name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs of the same branch/PR (saves runner minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest respx ruff

      - name: Lint and format check
        run: |
          ruff check sapdlm tests scripts
          ruff format --check sapdlm tests scripts

      - name: Run test suite
        run: pytest -q

      - name: Check web UI assets
        run: |
          # XML views/fragments must stay well-formed, JS must parse
          python - <<'EOF'
          import glob, xml.dom.minidom, sys
          for path in glob.glob("web/view/*.xml") + glob.glob("web/fragment/*.xml"):
              xml.dom.minidom.parse(path)
          print("XML OK:", len(glob.glob("web/view/*.xml") + glob.glob("web/fragment/*.xml")), "files")
          EOF
          for f in web/index.js web/util/Api.js web/controller/*.js; do
            node --check "$f"
          done
          echo "JS OK"

  ui:
    name: UI smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e . playwright
          python -c "from importlib.metadata import version; print(version('playwright'))" > pw-version.txt

      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('pw-version.txt') }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Start app with mocked portal
        run: |
          python scripts/mock_ui_server.py --port 8010 > /tmp/mock_server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8010/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8010/api/health

      - name: Run UI smoke test
        run: |
          UI_SMOKE_BASE_URL=http://127.0.0.1:8010/ui/ \
          UI_SMOKE_SHOT_DIR="$PWD/shots" python scripts/ui_smoke.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: shots/
          if-no-files-found: ignore

      - name: Dump mock server log
        if: failure()
        run: cat /tmp/mock_server.log

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sapdlm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
