name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest respx

      - name: Run test suite
        run: pytest -q

      - name: Check web UI assets
        run: |
          # XML views/fragments must stay well-formed, JS must parse
          python - <<'EOF'
          import glob, xml.dom.minidom, sys
          for path in glob.glob("web/view/*.xml") + glob.glob("web/fragment/*.xml"):
              xml.dom.minidom.parse(path)
          print("XML OK:", len(glob.glob("web/view/*.xml") + glob.glob("web/fragment/*.xml")), "files")
          EOF
          for f in web/index.js web/util/Api.js web/controller/*.js; do
            node --check "$f"
          done
          echo "JS OK"

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sapdlm:ci
