[project]
name = "sapdlm"
version = "0.1.0"
license = "Apache-2.0"
description = "SAP Download Manager - Python web rewrite (feature-compatible with DLManager.jar 3.2.1)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "fastmcp>=2.10",
]

[project.optional-dependencies]
rfc = []  # saprfclib added when the optional RFC path is implemented (PLAN.md 9.1)

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "playwright>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sapdlm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
